steps:
  # Run tests first before building images
  - name: "python:3.9-slim"
    id: "run-tests"
    entrypoint: "bash"
    args:
      - "-c"
      - |
        pip install --quiet -r requirements.txt
        pip install --quiet pytest pytest-asyncio pytest-cov
        pytest tests/ app/pipeline/tests/ -v --tb=short -x
    env:
      - "ENVIRONMENT=test"
      - "SUPABASE_URL=https://test.supabase.co"
      - "SUPABASE_SERVICE_ROLE_KEY=test-key"
      - "SUPABASE_ANON_KEY=test-anon-key"

  # Build main backend Docker image (only runs if tests pass)
  - name: "gcr.io/cloud-builders/docker"
    id: "build-backend"
    waitFor: ["run-tests"]
    args:
      [
        "build",
        "--no-cache",
        "-t",
        "us-central1-docker.pkg.dev/$PROJECT_ID/card-capture/$_BE_IMAGE_NAME_SUFFIX:$BUILD_ID",
        "-t",
        "us-central1-docker.pkg.dev/$PROJECT_ID/card-capture/$_BE_IMAGE_NAME_SUFFIX:latest",
        "-f",
        "Dockerfile",
        ".",
      ]

  # Build worker Docker image (only runs if tests pass)
  - name: "gcr.io/cloud-builders/docker"
    id: "build-worker"
    waitFor: ["run-tests"]
    args:
      [
        "build",
        "--no-cache",
        "-t",
        "us-central1-docker.pkg.dev/$PROJECT_ID/card-capture/$_WORKER_IMAGE_NAME_SUFFIX:$BUILD_ID",
        "-t",
        "us-central1-docker.pkg.dev/$PROJECT_ID/card-capture/$_WORKER_IMAGE_NAME_SUFFIX:latest",
        "-f",
        "Dockerfile.worker",
        ".",
      ]

  # Push backend images
  - name: "gcr.io/cloud-builders/docker"
    waitFor: ["build-backend"]
    args:
      [
        "push",
        "us-central1-docker.pkg.dev/$PROJECT_ID/card-capture/$_BE_IMAGE_NAME_SUFFIX:$BUILD_ID",
      ]
  - name: "gcr.io/cloud-builders/docker"
    waitFor: ["build-backend"]
    args:
      [
        "push",
        "us-central1-docker.pkg.dev/$PROJECT_ID/card-capture/$_BE_IMAGE_NAME_SUFFIX:latest",
      ]

  # Push worker images
  - name: "gcr.io/cloud-builders/docker"
    waitFor: ["build-worker"]
    args:
      [
        "push",
        "us-central1-docker.pkg.dev/$PROJECT_ID/card-capture/$_WORKER_IMAGE_NAME_SUFFIX:$BUILD_ID",
      ]
  - name: "gcr.io/cloud-builders/docker"
    waitFor: ["build-worker"]
    args:
      [
        "push",
        "us-central1-docker.pkg.dev/$PROJECT_ID/card-capture/$_WORKER_IMAGE_NAME_SUFFIX:latest",
      ]

  # Deploy backend to Cloud Run
  - name: "gcr.io/cloud-builders/gcloud"
    args:
      [
        "run",
        "deploy",
        "$_BE_CLOUD_RUN_SERVICE",
        "--image",
        "us-central1-docker.pkg.dev/$PROJECT_ID/card-capture/$_BE_IMAGE_NAME_SUFFIX:$BUILD_ID",
        "--platform",
        "managed",
        "--region",
        "us-central1",
        "--allow-unauthenticated",
      ]

  # Deploy worker to Cloud Run
  # Scaling recommendation for college fair events (300 students, 50 schools):
  #   --min-instances=3 --max-instances=10
  # Set these via Cloud Run console or gcloud CLI before fair events to ensure
  # warm instances are ready for burst traffic. Reset to defaults after.
  - name: "gcr.io/cloud-builders/gcloud"
    args:
      [
        "run",
        "deploy",
        "$_WORKER_CLOUD_RUN_SERVICE",
        "--image",
        "us-central1-docker.pkg.dev/$PROJECT_ID/card-capture/$_WORKER_IMAGE_NAME_SUFFIX:$BUILD_ID",
        "--platform",
        "managed",
        "--region",
        "us-central1",
        "--timeout=3600s",
        "--cpu=1",
        "--memory=2048Mi",
        "--allow-unauthenticated",
      ]

images:
  - "us-central1-docker.pkg.dev/$PROJECT_ID/card-capture/$_BE_IMAGE_NAME_SUFFIX:$BUILD_ID"
  - "us-central1-docker.pkg.dev/$PROJECT_ID/card-capture/$_WORKER_IMAGE_NAME_SUFFIX:$BUILD_ID"

options:
  logging: CLOUD_LOGGING_ONLY
