steps:
  - name: "gcr.io/cloud-builders/docker"
    args:
      [
        "build",
        "--no-cache",
        "-t",
        "us-central1-docker.pkg.dev/$PROJECT_ID/card-capture/$_BE_IMAGE_NAME_SUFFIX:$BUILD_ID",
        "-t",
        "us-central1-docker.pkg.dev/$PROJECT_ID/card-capture/$_BE_IMAGE_NAME_SUFFIX:latest",
        "-f",
        "Dockerfile",
        ".",
      ]
  - name: "gcr.io/cloud-builders/docker"
    args:
      [
        "build",
        "--no-cache",
        "-t",
        "us-central1-docker.pkg.dev/$PROJECT_ID/card-capture/$_WORKER_IMAGE_NAME_SUFFIX:$BUILD_ID",
        "-t",
        "us-central1-docker.pkg.dev/$PROJECT_ID/card-capture/$_WORKER_IMAGE_NAME_SUFFIX:latest",
        "-f",
        "Dockerfile.worker",
        ".",
      ]
  - name: "gcr.io/cloud-builders/docker"
    args:
      [
        "push",
        "us-central1-docker.pkg.dev/$PROJECT_ID/card-capture/$_BE_IMAGE_NAME_SUFFIX:$BUILD_ID",
      ]
  - name: "gcr.io/cloud-builders/docker"
    args:
      [
        "push",
        "us-central1-docker.pkg.dev/$PROJECT_ID/card-capture/$_BE_IMAGE_NAME_SUFFIX:latest",
      ]
  - name: "gcr.io/cloud-builders/docker"
    args:
      [
        "push",
        "us-central1-docker.pkg.dev/$PROJECT_ID/card-capture/$_WORKER_IMAGE_NAME_SUFFIX:$BUILD_ID",
      ]
  - name: "gcr.io/cloud-builders/docker"
    args:
      [
        "push",
        "us-central1-docker.pkg.dev/$PROJECT_ID/card-capture/$_WORKER_IMAGE_NAME_SUFFIX:latest",
      ]
  - name: "gcr.io/cloud-builders/gcloud"
    args:
      [
        "run",
        "deploy",
        "$_BE_CLOUD_RUN_SERVICE",
        "--image",
        "us-central1-docker.pkg.dev/$PROJECT_ID/card-capture/$_BE_IMAGE_NAME_SUFFIX:$BUILD_ID",
        "--platform",
        "managed",
        "--region",
        "us-central1",
        "--allow-unauthenticated",
      ]
  - name: "gcr.io/cloud-builders/gcloud"
    args:
      [
        "run",
        "deploy",
        "$_WORKER_CLOUD_RUN_SERVICE",
        "--image",
        "us-central1-docker.pkg.dev/$PROJECT_ID/card-capture/$_WORKER_IMAGE_NAME_SUFFIX:$BUILD_ID",
        "--platform",
        "managed",
        "--region",
        "us-central1",
        "--timeout=3600s",
        "--cpu=1",
        "--memory=2048Mi",
        "--allow-unauthenticated",
      ]

images:
  - "us-central1-docker.pkg.dev/$PROJECT_ID/card-capture/$_BE_IMAGE_NAME_SUFFIX:$BUILD_ID"
  - "us-central1-docker.pkg.dev/$PROJECT_ID/card-capture/$_WORKER_IMAGE_NAME_SUFFIX:$BUILD_ID"

options:
  logging: CLOUD_LOGGING_ONLY
