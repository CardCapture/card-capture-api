<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CardCapture Universal Inquiry Card - Front</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary-blue: #1977FF;
            --primary-dark: #1565D8;
            --text-dark: #1a1a2e;
            --background: #ffffff;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f1f5f9;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .card-front {
            width: 5.5in;
            height: 8in;
            background: var(--background);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding: 0.5in;
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.1);
            border-radius: 8px;
            position: relative;
        }

        @media print {
            body {
                background: white;
                padding: 0;
            }
            .card-front {
                box-shadow: none;
                border-radius: 0;
            }
        }

        .logo-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -75%);
        }

        .logo {
            width: 144px;
            height: 144px;
            margin-bottom: 20px;
        }

        .brand-name {
            font-size: 36px;
            font-weight: 700;
            color: var(--text-dark);
            letter-spacing: -0.5px;
        }

        .tagline {
            font-size: 16px;
            font-weight: 500;
            color: var(--primary-blue);
            margin-top: 8px;
            letter-spacing: 0.5px;
        }

        .qr-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            position: absolute;
            bottom: 0.6in;
            left: 50%;
            transform: translateX(-50%);
        }

        .qr-code {
            width: 100px;
            height: 100px;
        }

        .qr-label {
            font-size: 11px;
            font-weight: 600;
            color: var(--primary-blue);
            margin-top: 10px;
            text-align: center;
        }
    </style>
</head>
