[pytest]
testpaths = tests app/pipeline/tests
python_files = test_*.py
python_functions = test_*
python_classes = Test*
addopts =
    -v
    --tb=short
    --strict-markers
    -ra
markers =
    unit: Unit tests (fast, no external dependencies)
    integration: Integration tests (may need test database)
    slow: Slow tests (>5s)
    external: Tests that call external services
    security: Security tests (RLS, SECURITY DEFINER, etc.)
    rls: Row Level Security policy tests
    security_definer: SECURITY DEFINER function tests
    multi_tenant: Multi-tenant isolation tests (API-level authorization)
    asyncio: Async tests (using pytest-asyncio)
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
